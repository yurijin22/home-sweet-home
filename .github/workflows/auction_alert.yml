name: My auction harness

on:
  schedule:
    # 하루 4회 시도 (KST 06·09·13·19시) — 간헐 IP차단 대비. 걸리는 게 있을 때만 이슈 생성
    - cron: '0 21 * * *'   # 06:00 KST (전날 UTC)
    - cron: '0 0 * * *'    # 09:00 KST
    - cron: '0 4 * * *'    # 13:00 KST
    - cron: '0 10 * * *'   # 19:00 KST
  workflow_dispatch:

permissions:
  contents: write         # 낙찰결과 아카이브 커밋(데이터 축적)
  issues: write           # 알림 이슈 (내장 GITHUB_TOKEN)

concurrency:
  group: auction-harness
  cancel-in-progress: false

jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # ── 오늘 이미 하네스 이슈가 떴으면 skip (중복 알림 방지) ──
      - name: Guard — 오늘 알림 여부
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(TZ=Asia/Seoul date +%Y-%m-%d)
          DONE=$(gh issue list --state all --limit 40 --json title \
                 --jq "[.[] | select(.title | contains(\"[하네스]\") and contains(\"${DATE}\"))] | length" 2>/dev/null || echo 0)
          echo "done=$DONE" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "guard: done=$DONE"

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.done == '0'
        with:
          python-version: '3.11'

      - name: Install Playwright
        if: steps.guard.outputs.done == '0'
        run: |
          pip install playwright
          python -m playwright install chromium --with-deps

      - name: Fetch Seoul auctions (최대 3회 재시도)
        if: steps.guard.outputs.done == '0'
        run: |
          DATE=$(TZ=Asia/Seoul date +%Y_%m_%d)
          for attempt in 1 2 3; do
            python scraper/fetch_auction_seoul.py || true
            CNT=$(python -c "import json; print(len(json.load(open('data/auction_raw_${DATE}.json'))))" 2>/dev/null || echo 0)
            if [ "$CNT" != "0" ]; then echo "수집 $CNT건 (시도 $attempt)"; break; fi
            echo "0건 (시도 $attempt/3)"
            [ "$attempt" != "3" ] && sleep $((attempt*90)) || true
          done

      # ── 나만의 하네스: 타깃 사건·워치 단지·조건 신건 — 걸릴 때만 출력 ──
      - name: Run my harness
        id: harness
        if: steps.guard.outputs.done == '0'
        run: |
          python scripts/my_harness.py > data/my_harness_digest.md || true
          SIZE=$(wc -c < data/my_harness_digest.md | tr -d ' ')
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          cat data/my_harness_digest.md

      - name: Issue — 하네스 알림 (걸린 것 있을 때만)
        if: steps.guard.outputs.done == '0' && steps.harness.outputs.size > 10
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "[하네스] 관심 물건 감지 — ${{ steps.guard.outputs.date }}" \
            --body-file data/my_harness_digest.md \
            --assignee "${{ github.repository_owner }}"

      # ── 낙찰결과 수집·아카이브 (조용히 데이터만 축적 — 이슈 없음) ──
      - name: Fetch & archive 낙찰결과
        if: steps.guard.outputs.done == '0'
        run: |
          DATE=$(TZ=Asia/Seoul date +%Y_%m_%d)
          python scraper/fetch_auction_results.py || true
          python - "$DATE" <<'PY'
          import json, sys
          from pathlib import Path
          date = sys.argv[1]
          data = Path('data')
          today_f = data / f'auction_results_{date}.json'
          arch_f = data / 'auction_results_archive.json'
          if not today_f.exists():
              print('오늘 결과 없음'); sys.exit(0)
          today = json.load(open(today_f, encoding='utf-8'))
          arch = json.load(open(arch_f, encoding='utf-8')) if arch_f.exists() else []
          seen = {(x.get('case_no'), x.get('sale_date')) for x in arch}
          added = 0
          for it in today:
              key = (it.get('case_no'), it.get('sale_date'))
              if it.get('result') == '매각' and key not in seen:
                  arch.append(it); seen.add(key); added += 1
          json.dump(arch, open(arch_f, 'w', encoding='utf-8'), ensure_ascii=False, indent=2)
          print(f'아카이브 +{added}건 (누적 {len(arch)}건)')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/auction_results_archive.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "새 데이터 없음"
          else
            git commit -m "낙찰결과 아카이브 $(TZ=Asia/Seoul date +%Y-%m-%d)"
            git push
          fi

      - name: Upload artifacts
        if: always() && steps.guard.outputs.done == '0'
        uses: actions/upload-artifact@v4
        with:
          name: harness-${{ steps.guard.outputs.date }}
          path: |
            data/auction_raw_*.json
            data/auction_results_*.json
            data/my_harness_digest.md
          if-no-files-found: ignore
          retention-days: 14
